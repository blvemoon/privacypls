# Nginx site config for privacypls.io
# Install: see docs/DEPLOY.md. Certbot adds the HTTPS (port 443) parts to this
# file automatically when you run `sudo certbot --nginx`.

# Request limits, tracked in memory per visitor address (never written to disk).
limit_req_zone $binary_remote_addr zone=pp_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pp_analyze:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=pp_challenge:10m rate=30r/m;
limit_req_status 429;
# Log limit hits at "warn"; the error log below only keeps "crit", so these
# messages (which include an IP address) are not written.
limit_req_log_level warn;

# Access log format with NO IP address, NO query string ($uri has none), no referrer, no user agent.
log_format pp_privacy '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

# Catch-all: requests that don't name privacypls.io (bots scanning IPs) get dropped, not logged.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name privacypls.io www.privacypls.io;

    access_log /var/log/nginx/privacypls.access.log pp_privacy;
    error_log /var/log/nginx/privacypls.error.log crit;

    client_max_body_size 2m;
    server_tokens off;

    location = /api/analyze {
        limit_req zone=pp_analyze burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/privacypls-proxy.conf;
        # AI analysis of long documents can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    location = /api/challenge {
        limit_req zone=pp_challenge burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/privacypls-proxy.conf;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=pp_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/privacypls-proxy.conf;
        proxy_read_timeout 60s;
    }
}
